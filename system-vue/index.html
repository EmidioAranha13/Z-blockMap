<!DOCTYPE html>
<html lang="pt-BR" class="theme-dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Z-blockMap — editor de mapas em blocos</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' fill='%231c1f1c'/><rect x='8' y='8' width='20' height='20' fill='%23c4a35a'/><rect x='36' y='8' width='20' height='20' fill='%232e342e'/><rect x='8' y='36' width='20' height='20' fill='%232e342e'/><rect x='36' y='36' width='20' height='20' fill='%23d97b54'/></svg>" />
    <script>
      try {
        var savedTheme = localStorage.getItem('zblockmap-theme')
        if (savedTheme === 'light' || savedTheme === 'day') {
          document.documentElement.classList.remove('theme-dark')
          document.documentElement.classList.add('theme-light')
        }
      } catch (error) {
        /* storage pode estar bloqueado */
      }
    </script>
  </head>
  <body>
    <!-- Ponto de montagem da aplicação Vue (ver src/main.js) -->
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
